<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gridclass{
            display: grid;
            grid-gap: 30px;
            background-color: violet;
            padding: 30px;
            grid: 10px 10px 10px / 40px 40px 40px;
        }
        .gfg {
            border: 2px solid blue;
            height: 30px;
            width: 30px;
            text-align: center;
            padding-top: 20px 0;
        }
    </style>
</head>
<body>
    <div class="gridclass">
         <div class="gfg">1</div> 
        <div class="gfg">2</div> 
        <div class="gfg">3</div> 
        <div class="gfg">4</div> 
        <div class="gfg">5</div> 
        <div class="gfg">6</div> 
        <div class="gfg">7</div> 
        <div class="gfg">8</div> 
    </div>
</body>
</html>
